</head>
<body>

    <script>
        const conceptTerms = {
            'planck': {
                title: '普朗克常数',
                content: `<p><strong>定义：</strong>普朗克常数\\( h \\)是量子力学中的基本常数，其值约为\\( 6.626 \\times 10^{-34} \\, \\text{J·s} \\)。</p>
                         <p><strong>来源：</strong>1900年，马克斯·普朗克在研究黑体辐射时提出能量量子化假说，引入了这一常数。他假设能量以离散的"量子"形式存在，\\( E = h\\nu \\)，其中\\( \\nu \\)是频率。</p>
                         <p><strong>意义：</strong>普朗克常数标志着经典物理学与量子物理学的分野，是量子力学的基石之一。约化普朗克常数\\( \\hbar = h/(2\\pi) \\)在量子力学中更为常用。</p>`
            },
            'debroglie': {
                title: '德布罗意波',
                content: `<p><strong>定义：</strong>德布罗意波，又称物质波，指所有微观粒子都具有波动性。</p>
                         <p><strong>来源：</strong>1924年，路易·德布罗意在其博士论文中提出物质波假说，认为任何运动的粒子都具有波动性，波长\\( \\lambda = h/p \\)，其中\\( p \\)是粒子动量。</p>
                         <p><strong>意义：</strong>这一假说揭示了微观粒子的波粒二象性，为薛定谔方程的建立奠定了基础，并被电子衍射实验所证实。</p>`
            },
            'uncertainty': {
                title: '海森堡不确定性原理',
                content: `<p><strong>定义：</strong>无法同时精确测量粒子的位置和动量，\\( \\Delta x \\cdot \\Delta p_x \\geq \\hbar/2 \\)。</p>
                         <p><strong>来源：</strong>1927年，维尔纳·海森堡提出这一原理，揭示了微观世界的基本限制。</p>
                         <p><strong>意义：</strong>不确定性原理是量子力学的核心原理之一，表明微观粒子的行为与经典粒子有本质区别。</p>`
            },
            'collapse': {
                title: '波函数坍缩',
                content: `<p><strong>定义：</strong>当对量子系统进行测量时，波函数会从叠加态瞬间"坍缩"到某一个本征态。</p>
                         <p><strong>来源：</strong>这是量子力学哥本哈根诠释的核心概念，由玻尔和海森堡等人提出。</p>
                         <p><strong>意义：</strong>波函数坍缩是量子测量的基本特征，体现了观察行为对量子系统的影响。</p>`
            }
        };

        function openTermModal(termId) {
            const term = conceptTerms[termId];
            document.getElementById('term-title').textContent = term.title;
            document.getElementById('term-content').innerHTML = term.content;
            document.getElementById('term-modal').classList.add('active');
            MathJax.typeset();
        }

        function closeTermModal() {
            document.getElementById('term-modal').classList.remove('active');
        }

        const modalData = {
            history: {
                title: '历史背景',
                content: `
                    <div class="section">
                        <h4>量子力学的诞生</h4>
                        <p>20世纪初，经典物理学在解释微观现象时遇到了根本性的困难：</p>
                        <ol>
                            <li><strong>黑体辐射问题</strong>：经典理论预言紫外灾难，普朗克于1900年提出能量量子化假说</li>
                            <li><strong>光电效应</strong>：爱因斯坦于1905年提出光子概念，解释了光的粒子性</li>
                            <li><strong>原子结构</strong>：卢瑟福的核式模型无法解释原子稳定性，玻尔于1913年提出量子化轨道理论</li>
                            <li><strong>物质波</strong>：德布罗意于1924年提出物质波假说，揭示微观粒子的波粒二象性</li>
                        </ol>
                    </div>
                    <div class="section">
                        <h4>薛定谔方程的提出</h4>
                        <p>1926年，埃尔温·薛定谔在德布罗意物质波假说的基础上，提出了描述量子系统状态随时间演化的偏微分方程。这一方程与海森堡的矩阵力学等价，共同构成量子力学的数学基础。</p>
                        <div class="equation-box">
                            <h5>薛定谔方程的发现历程</h5>
                            <p style="font-size: 0.9rem;">德布罗意关系 → 哈密顿-雅可比方程 → 薛定谔方程</p>
                        </div>
                    </div>
                    <div class="section">
                        <h4>波粒二象性与波函数诠释</h4>
                        <p>薛定谔方程描述了微观粒子的波动性，波函数\\( \\psi(\\mathbf{r},t) \\)包含了粒子的所有信息。玻恩的统计诠释指出，\\( |\\psi|^2 d\\mathbf{r} \\)表示在空间微元\\( d\\mathbf{r} \\)内找到粒子的概率。</p>
                    </div>
                    <div class="section">
                        <h4>核心概念</h4>
                        <p>点击以下概念标签查看详细解释：</p>
                        <div class="concept-map">
                            <div class="concept-tag" onclick="openTermModal('planck')">普朗克常数</div>
                            <div class="concept-tag" onclick="openTermModal('debroglie')">德布罗意波</div>
                            <div class="concept-tag" onclick="openTermModal('uncertainty')">海森堡不确定性原理</div>
                            <div class="concept-tag" onclick="openTermModal('collapse')">波函数坍缩</div>
                        </div>
                    </div>
                `
            },
            equation: {
                title: '方程构建',
                content: `
                    <div class="section">
                        <h4>含时薛定谔方程的推导</h4>
                        <div class="derivation-step">
                            <h5>步骤1：从平面波出发</h5>
                            <p>自由粒子的德布罗意波：\\( \\psi(\\mathbf{r},t) = A e^{i(\\mathbf{k} \\cdot \\mathbf{r} - \\omega t)} \\)</p>
                            <p>其中\\( \\mathbf{k} = \\frac{\\mathbf{p}}{\\hbar} \\)，\\( \\omega = \\frac{E}{\\hbar} \\)</p>
                        </div>
                        <div class="derivation-step">
                            <h5>步骤2：引入算符</h5>
                            <p>动量算符：\\( \\hat{\\mathbf{p}} = -i\\hbar \\nabla \\)</p>
                            <p>能量算符：\\( \\hat{E} = i\\hbar \\frac{\\partial}{\\partial t} \\)</p>
                        </div>
                        <div class="derivation-step">
                            <h5>步骤3：建立波动方程</h5>
                            <p>对平面波求时间导数：\\( i\\hbar \\frac{\\partial \\psi}{\\partial t} = \\hbar \\omega \\psi = E \\psi \\)</p>
                            <p>对平面波求梯度的平方：\\( -\\hbar^2 \\nabla^2 \\psi = \\hbar^2 k^2 \\psi = p^2 \\psi \\)</p>
                        </div>
                        <div class="equation-box">
                            <h5>含时薛定谔方程（一般形式）</h5>
                            <p>\\( i\\hbar \\frac{\\partial \\psi}{\\partial t} = \\left( -\\frac{\\hbar^2}{2m} \\nabla^2 + V(\\mathbf{r},t) \\right) \\psi \\)</p>
                        </div>
                        <p>其中\\( \\hat{H} = -\\frac{\\hbar^2}{2m} \\nabla^2 + V(\\mathbf{r},t) \\)称为哈密顿算符。</p>
                    </div>
                    <div class="section">
                        <h4>定态薛定谔方程</h4>
                        <p>当势能\\( V(\\mathbf{r}) \\)不显含时间时，可采用分离变量法：\\( \\psi(\\mathbf{r},t) = \\psi(\\mathbf{r}) f(t) \\)</p>
                        <div class="derivation-step">
                            <h5>分离变量过程</h5>
                            <p>代入含时方程得：\\( \\frac{i\\hbar}{f(t)} \\frac{df}{dt} = \\frac{1}{\\psi(\\mathbf{r})} \\hat{H} \\psi(\\mathbf{r}) = E \\)</p>
                            <p>时间部分解：\\( f(t) = e^{-iEt/\\hbar} \\)</p>
                        </div>
                        <div class="equation-box">
                            <h5>定态薛定谔方程</h5>
                            <p>\\( \\hat{H} \\psi(\\mathbf{r}) = E \\psi(\\mathbf{r}) \\)</p>
                        </div>
                        <p>这是本征值方程，\\( E \\)为能量本征值，\\( \\psi(\\mathbf{r}) \\)为能量本征函数。</p>

                    <div class="section">

                                <p>波函数在空间每一点只能有一个确定值</p>
                            </div>
                        </div>
                    </div>
                `

                    ctx.beginPath();
                    ctx.moveTo(x0, baseY);
                    ctx.lineTo(x1, baseY);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.strokeStyle = colors[n-1];
                    ctx.lineWidth = 2;

                    for (let px = x0; px <= x1; px++) {
                        const xx = (px - x0) / (x1 - x0);
                        const k = n * Math.PI / L;
                        const wave = Math.sin(k * L * xx);
                        const canvasY = baseY - wave * scaleY / 2;

                        if (px === x0) {
                            ctx.moveTo(px, canvasY);
                        } else {
                            ctx.lineTo(px, canvasY);
                        }
                    }
                    ctx.stroke();

                    const E = calculateEnergy(n, L);

                    ctx.fillStyle = colors[n-1];
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(`n=${n}`, labelX, baseY - 8);
                    ctx.font = '10px Arial';
                    ctx.fillText(`E=${E.toFixed(3)} eV`, labelX, baseY + 6);

                    document.getElementById(`energy-n${n}`).textContent = E.toFixed(3);
                }

                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x0 - 5, y0);
                ctx.lineTo(x1 + 5, y0);
                ctx.moveTo(x0, y0 + 5);
                ctx.lineTo(x0, y1 - 5);
                ctx.stroke();

                ctx.fillStyle = '#333';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('x (位置)', x1 + 5, y0 + 18);
                ctx.save();
                ctx.translate(18, y0 - wellHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText('ψ(x) (波函数)', 0, 0);
                ctx.restore();

                ctx.fillStyle = '#666';
                ctx.font = '10px Arial';
                ctx.fillText('0', x0 - 18, y0 + 4);
                ctx.fillText('L', x1 - 5, y0 + 15);
                ctx.fillText('势阱区域', x0 + 20, y0 + 15);
            }

            draw();
            widthSlider.addEventListener('input', draw);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeTermModal();
            }
        });
    </script>
</body>
</html>
